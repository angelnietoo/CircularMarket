services:
  db:
    image: mysql:8.4
    container_name: circularmarket_db
    restart: always
    environment:
      MYSQL_DATABASE: circularmarket
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - circularmarket_mysql_data:/var/lib/mysql

  app:
    build: .
    container_name: circularmarket_app
    restart: always
    depends_on:
      - db
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/circularmarket?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

volumes:
  circularmarket_mysql_data: