<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Detalle categoría | CircularMarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 text-slate-950">

<div class="min-h-screen lg:flex">
    <div th:replace="~{fragments/sidebar-admin :: sidebar}"></div>

    <main class="flex-1 p-6 lg:p-8">
        <header class="mb-6 flex flex-col gap-4 rounded-[20px] border border-slate-200 bg-white p-6 shadow-lg sm:flex-row sm:items-center sm:justify-between">
            <div>
                <h2 class="text-2xl font-bold tracking-tight text-slate-900">Detalle de la categoría</h2>
                <p class="mt-1 text-sm text-slate-500">Consulta completa de la categoría seleccionada</p>
            </div>

            <div class="flex flex-wrap gap-2">
                <a th:href="@{/admin/categorias}"
                   class="inline-flex items-center justify-center rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm font-semibold text-slate-700 transition hover:bg-slate-100">
                    Volver
                </a>

                <a th:href="@{/admin/categorias/{id}/editar(id=${categoria.id})}"
                   class="inline-flex items-center justify-center rounded-2xl bg-blue-600 px-4 py-3 text-sm font-semibold text-white transition hover:bg-blue-700">
                    Editar categoría
                </a>
            </div>
        </header>

        <section class="rounded-[20px] border border-slate-200 bg-white p-6 shadow-lg">
            <div class="mb-6 border-b border-slate-200 pb-5">
                <p class="text-xs font-bold uppercase tracking-[0.2em] text-blue-600">Categoría</p>

                <h1 class="mt-2 text-3xl font-extrabold text-slate-900"
                    th:text="${categoria.nombre}">
                    Categoría
                </h1>

                <p class="mt-2 text-sm text-slate-500"
                   th:text="'ID interno: #' + ${categoria.id}">
                    ID interno
                </p>
            </div>

            <div class="grid gap-4 md:grid-cols-2">
                <div class="rounded-2xl border border-slate-200 bg-slate-50 p-4">
                    <p class="text-xs font-bold uppercase tracking-wide text-slate-500">Nombre</p>
                    <p class="mt-2 text-sm font-semibold text-slate-900" th:text="${categoria.nombre}">
                        Nombre
                    </p>
                </div>

                <div class="rounded-2xl border border-slate-200 bg-slate-50 p-4">
                    <p class="text-xs font-bold uppercase tracking-wide text-slate-500">Estado</p>

                    <span th:if="${categoria.activa}"
                          class="mt-2 inline-flex rounded-full bg-emerald-100 px-3 py-1 text-xs font-bold text-emerald-700">
                        Activa
                    </span>

                    <span th:unless="${categoria.activa}"
                          class="mt-2 inline-flex rounded-full bg-rose-100 px-3 py-1 text-xs font-bold text-rose-700">
                        Inactiva
                    </span>
                </div>

                <div class="rounded-2xl border border-slate-200 bg-slate-50 p-4">
                    <p class="text-xs font-bold uppercase tracking-wide text-slate-500">Productos activos asociados</p>
                    <p class="mt-2 text-2xl font-extrabold text-slate-900"
                       th:text="${totalProductosCategoria}">
                        0
                    </p>
                </div>

                <div class="rounded-2xl border border-slate-200 bg-slate-50 p-4 md:col-span-2">
                    <p class="text-xs font-bold uppercase tracking-wide text-slate-500">Descripción</p>
                    <p class="mt-2 whitespace-pre-line text-sm leading-7 text-slate-700"
                       th:text="${categoria.descripcion != null and !categoria.descripcion.isBlank() ? categoria.descripcion : 'Sin descripción'}">
                        Descripción
                    </p>
                </div>
            </div>
        </section>
    </main>
</div>

</body>
</html>
