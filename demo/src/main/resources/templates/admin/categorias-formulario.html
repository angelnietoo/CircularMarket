<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${categoria.id == null ? 'Nueva categoría' : 'Editar categoría'} + ' | CircularMarket'">Formulario de categoría | CircularMarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-950">

<div class="min-h-screen lg:flex">
    <div th:replace="~{fragments/sidebar-admin :: sidebar}"></div>

    <main class="flex-1 p-6 lg:p-8">
        <header class="mb-6 flex flex-col gap-4 rounded-[20px] border border-slate-200 bg-white p-6 shadow-lg sm:flex-row sm:items-center sm:justify-between">
            <div>
                <h2 class="text-2xl font-bold tracking-tight text-slate-900"
                    th:text="${categoria.id == null ? 'Nueva categoría' : 'Editar categoría'}">
                    Nueva categoría
                </h2>
                <p class="mt-1 text-sm text-slate-500">
                    Rellena los datos para guardar la categoría
                </p>
            </div>

            <a th:href="@{/admin/categorias}"
               class="inline-flex items-center justify-center rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm font-semibold text-slate-700 transition hover:bg-slate-100">
                Volver al listado
            </a>
        </header>

        <div th:if="${error}"
             class="mb-6 rounded-2xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm font-semibold text-rose-700"
             th:text="${error}">
        </div>

        <section class="rounded-[20px] border border-slate-200 bg-white shadow-lg">
            <div class="border-b border-slate-200 bg-slate-50 px-5 py-4">
                <h3 class="text-lg font-semibold text-slate-900">Datos de la categoría</h3>
            </div>

            <form th:object="${categoria}"
                  th:action="${categoria.id != null} ? @{/admin/categorias/guardar/{id}(id=${categoria.id})} : @{/admin/categorias/guardar}"
                  method="post"
                  class="space-y-6 p-6">

                <input type="hidden" th:field="*{id}" />

                <input type="hidden"
                       th:if="${_csrf != null}"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}" />

                <div class="grid gap-4 md:grid-cols-2">
                    <div class="space-y-2 md:col-span-2">
                        <label for="nombre" class="block text-sm font-semibold text-slate-700">Nombre</label>
                        <input type="text"
                               id="nombre"
                               th:field="*{nombre}"
                               placeholder="Nombre de la categoría"
                               required
                               class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100" />

                        <small th:if="${#fields.hasErrors('nombre')}"
                               th:errors="*{nombre}"
                               class="block rounded-lg border border-rose-200 bg-rose-50 px-3 py-2 text-sm text-rose-700"></small>
                    </div>

                    <div class="space-y-2 md:col-span-2">
                        <label for="descripcion" class="block text-sm font-semibold text-slate-700">Descripción</label>
                        <textarea id="descripcion"
                                  th:field="*{descripcion}"
                                  placeholder="Descripción de la categoría"
                                  rows="4"
                                  class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100"></textarea>

                        <small th:if="${#fields.hasErrors('descripcion')}"
                               th:errors="*{descripcion}"
                               class="block rounded-lg border border-rose-200 bg-rose-50 px-3 py-2 text-sm text-rose-700"></small>
                    </div>

                    <div class="space-y-2 md:col-span-2">
                        <label class="flex items-center gap-3 text-sm font-semibold text-slate-700">
                            <input type="checkbox"
                                   th:field="*{activa}"
                                   class="h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500" />
                            Activa
                        </label>

                        <small th:if="${#fields.hasErrors('activa')}"
                               th:errors="*{activa}"
                               class="block rounded-lg border border-rose-200 bg-rose-50 px-3 py-2 text-sm text-rose-700"></small>
                    </div>
                </div>

                <div class="flex flex-col gap-3 border-t border-slate-200 pt-5 sm:flex-row sm:justify-end">
                    <a th:href="@{/admin/categorias}"
                       class="inline-flex items-center justify-center rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm font-semibold text-slate-700 transition hover:bg-slate-100">
                        Cancelar
                    </a>

                    <button type="submit"
                            class="inline-flex items-center justify-center rounded-2xl bg-blue-600 px-4 py-3 text-sm font-semibold text-white transition hover:bg-blue-700"
                            th:text="${categoria.id == null ? 'Crear categoría' : 'Guardar cambios'}">
                        Guardar
                    </button>
                </div>
            </form>
        </section>
    </main>
</div>

</body>
</html>
