<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Categorías | CircularMarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-950">

<div class="min-h-screen lg:flex">
    <div th:replace="~{fragments/sidebar-admin :: sidebar}"></div>

    <main class="flex-1 p-6 lg:p-8">
        <header class="mb-6 flex flex-col gap-4 rounded-[20px] border border-slate-200 bg-white p-6 shadow-lg sm:flex-row sm:items-center sm:justify-between">
            <div>
                <h2 class="text-2xl font-bold tracking-tight text-slate-900">Categorías</h2>
                <p class="mt-1 text-sm text-slate-500">Gestiona las categorías del catálogo</p>
            </div>

            <a th:href="@{/admin/categorias/nueva}"
               class="inline-flex items-center justify-center rounded-2xl bg-blue-600 px-4 py-3 text-sm font-semibold text-white transition hover:bg-blue-700">
                Nueva categoría
            </a>
        </header>

        <section class="overflow-hidden rounded-[20px] border border-slate-200 bg-white shadow-lg">
            <div class="border-b border-slate-200 bg-slate-50 px-5 py-4">
                <h3 class="text-lg font-semibold text-slate-900">Listado de categorías</h3>
            </div>

            <div th:if="${error}"
                 class="border-b border-rose-200 bg-rose-50 px-5 py-3 text-sm font-semibold text-rose-700"
                 th:text="${error}">
            </div>

            <div class="overflow-x-auto">
                <table class="w-full table-auto divide-y divide-slate-200">
                    <thead class="bg-white">
                    <tr>
                        <th class="w-20 px-5 py-2 text-left text-sm font-semibold text-slate-700 align-middle">ID</th>
                        <th class="px-5 py-2 text-left text-sm font-semibold text-slate-700 align-middle">Nombre</th>
                        <th class="px-5 py-2 text-left text-sm font-semibold text-slate-700 align-middle">Descripción</th>
                        <th class="w-32 px-5 py-2 text-left text-sm font-semibold text-slate-700 align-middle">Activa</th>
                        <th class="w-56 px-5 py-2 text-center text-sm font-semibold text-slate-700 align-middle">Acciones</th>
                    </tr>
                    </thead>

                    <tbody class="divide-y divide-slate-200 bg-white">
                    <tr th:if="${#lists.isEmpty(categorias)}">
                        <td colspan="5" class="px-5 py-6 text-center text-sm text-slate-500">
                            No hay categorías registradas.
                        </td>
                    </tr>

                    <tr th:each="categoria : ${categorias}" class="hover:bg-slate-50">
                        <td class="px-5 py-2 text-sm font-medium text-slate-900 align-middle whitespace-nowrap"
                            th:text="${categoria.id}">1</td>

                        <td class="px-5 py-2 text-sm text-slate-700 align-middle"
                            th:text="${categoria.nombre}">Electrónica</td>

                        <td class="px-5 py-2 text-sm text-slate-700 align-middle"
                            th:text="${categoria.descripcion}">Descripción</td>

                        <td class="px-5 py-2 text-sm text-slate-700 align-middle whitespace-nowrap">
                            <span th:if="${categoria.activa}"
                                  class="inline-flex items-center rounded-full bg-emerald-100 px-3 py-1 text-xs font-semibold text-emerald-700">
                                Activa
                            </span>
                            <span th:unless="${categoria.activa}"
                                  class="inline-flex items-center rounded-full bg-rose-100 px-3 py-1 text-xs font-semibold text-rose-700">
                                Inactiva
                            </span>
                        </td>

                        <td class="px-5 py-2 align-middle">
                            <div class="flex flex-wrap justify-center gap-2">
                                <a th:href="@{/admin/categorias/{id}/editar(id=${categoria.id})}"
                                   class="inline-flex items-center justify-center rounded-xl border border-slate-200 bg-white px-3 py-1.5 text-sm font-semibold text-slate-700 transition hover:bg-slate-100">
                                    Editar
                                </a>

                                <form th:action="@{/admin/categorias/{id}/eliminar(id=${categoria.id})}"
                                      method="post"
                                      onsubmit="return confirm('¿Seguro que quieres eliminar esta categoría?');">
                                    <input type="hidden"
                                           th:if="${_csrf != null}"
                                           th:name="${_csrf.parameterName}"
                                           th:value="${_csrf.token}" />
                                    <button type="submit"
                                            class="inline-flex items-center justify-center rounded-xl bg-rose-600 px-3 py-1.5 text-sm font-semibold text-white transition hover:bg-rose-700">
                                        Eliminar
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>

</body>
</html>
