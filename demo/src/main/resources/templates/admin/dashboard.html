<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de administración | CircularMarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-100 text-slate-900 antialiased">
<div class="flex min-h-screen flex-col lg:flex-row">

    <aside th:replace="~{fragments/sidebar-admin :: sidebar}"></aside>

    <main class="flex-1 min-w-0">
        <div class="mx-auto max-w-7xl p-6 lg:p-8">

            <header class="mb-6 rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
                <div class="flex flex-col gap-5 sm:flex-row sm:items-center sm:justify-between">
                    <div>
                        <p class="text-sm font-medium uppercase tracking-[0.2em] text-blue-600">Resumen general</p>
                        <h2 class="mt-2 text-3xl font-bold tracking-tight text-slate-900">Dashboard</h2>
                        <p class="mt-2 text-sm text-slate-500">Visión general del estado de la aplicación</p>
                    </div>
                </div>
            </header>

            <section class="grid gap-5 sm:grid-cols-2 xl:grid-cols-4">
                <article class="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm transition hover:shadow-md">
                    <div class="mb-4 flex items-center justify-between">
                        <span class="text-sm font-medium text-slate-500">Usuarios</span>
                        <span class="h-2.5 w-2.5 rounded-full bg-blue-600"></span>
                    </div>
                    <strong class="block text-4xl font-bold tracking-tight text-slate-900"
                            th:text="${totalUsuarios != null ? totalUsuarios : 0}">0</strong>
                    <span class="mt-2 block text-sm text-slate-500">Registrados en la plataforma</span>
                </article>

                <article class="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm transition hover:shadow-md">
                    <div class="mb-4 flex items-center justify-between">
                        <span class="text-sm font-medium text-slate-500">Administradores</span>
                        <span class="h-2.5 w-2.5 rounded-full bg-emerald-500"></span>
                    </div>
                    <strong class="block text-4xl font-bold tracking-tight text-slate-900"
                            th:text="${totalAdmins != null ? totalAdmins : 0}">0</strong>
                    <span class="mt-2 block text-sm text-slate-500">Con acceso al panel</span>
                </article>

                <article class="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm transition hover:shadow-md">
                    <div class="mb-4 flex items-center justify-between">
                        <span class="text-sm font-medium text-slate-500">Productos</span>
                        <span class="h-2.5 w-2.5 rounded-full bg-violet-500"></span>
                    </div>
                    <strong class="block text-4xl font-bold tracking-tight text-slate-900"
                            th:text="${totalProductos != null ? totalProductos : 0}">0</strong>
                    <span class="mt-2 block text-sm text-slate-500">Publicados en el catálogo</span>
                </article>

                <article class="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm transition hover:shadow-md">
                    <div class="mb-4 flex items-center justify-between">
                        <span class="text-sm font-medium text-slate-500">Pedidos</span>
                        <span class="h-2.5 w-2.5 rounded-full bg-amber-500"></span>
                    </div>
                    <strong class="block text-4xl font-bold tracking-tight text-slate-900"
                            th:text="${totalPedidos != null ? totalPedidos : 0}">0</strong>
                    <span class="mt-2 block text-sm text-slate-500">Pendientes de gestión</span>
                </article>
            </section>

        </div>
    </main>
</div>
</body>
</html>
