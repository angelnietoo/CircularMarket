<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${producto.id == null ? 'Nuevo producto' : 'Editar producto'} + ' | CircularMarket'">Formulario de producto | CircularMarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-950 font-sans">

<main class="min-h-screen p-6 lg:p-8">
    <header class="mb-6 flex flex-col gap-5 rounded-[20px] border border-slate-200 bg-white/90 p-6 shadow-lg backdrop-blur sm:flex-row sm:items-center sm:justify-between">
        <div>
            <h2 class="text-2xl font-bold text-slate-900"
                th:text="${producto.id == null ? 'Nuevo producto' : 'Editar producto'}">Nuevo producto</h2>
            <p class="mt-2 text-sm text-slate-500"
               th:text="${producto.id == null ? 'Rellena los datos para crear un producto' : 'Modifica los datos del producto seleccionado'}">
                Formulario de producto
            </p>
        </div>

        <div class="flex">
            <a class="inline-flex items-center justify-center rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm font-semibold text-slate-700 transition hover:bg-slate-100"
               th:href="@{/admin/productos}">Volver al listado</a>
        </div>
    </header>

    <div th:if="${error}"
         class="mb-6 rounded-2xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm font-semibold text-rose-700"
         th:text="${error}">
    </div>

    <section class="rounded-[20px] border border-slate-200 bg-white/90 shadow-lg">
        <div class="border-b border-slate-200 bg-slate-50 px-5 py-4">
            <h3 class="text-lg font-semibold text-slate-900">Datos del producto</h3>
        </div>

        <form th:object="${producto}"
              th:action="@{/admin/productos/guardar}"
              method="post"
              enctype="multipart/form-data"
              class="space-y-6 p-6">

            <input type="hidden" th:field="*{id}" />

            <input type="hidden"
                   th:if="${_csrf != null}"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}" />

            <div class="grid gap-4 md:grid-cols-2">
                <div class="space-y-2">
                    <label for="titulo" class="block text-sm font-semibold text-slate-700">Título</label>
                    <input type="text"
                           id="titulo"
                           th:field="*{titulo}"
                           placeholder="Título del producto"
                           required
                           class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none focus:border-violet-500 focus:ring-4 focus:ring-violet-100" />
                    <small th:if="${#fields.hasErrors('titulo')}"
                           th:errors="*{titulo}"
                           class="block rounded-lg border border-rose-200 bg-rose-50 px-3 py-2 text-sm text-rose-700"></small>
                </div>

                <div class="space-y-2">
                    <label for="precio" class="block text-sm font-semibold text-slate-700">Precio</label>
                    <input type="number"
                           id="precio"
                           th:field="*{precio}"
                           step="0.01"
                           min="0"
                           placeholder="0.00"
                           required
                           class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none focus:border-violet-500 focus:ring-4 focus:ring-violet-100" />
                    <small th:if="${#fields.hasErrors('precio')}"
                           th:errors="*{precio}"
                           class="block rounded-lg border border-rose-200 bg-rose-50 px-3 py-2 text-sm text-rose-700"></small>
                </div>

                <div class="space-y-2">
                    <label for="stock" class="block text-sm font-semibold text-slate-700">Stock</label>
                    <input type="number"
                           id="stock"
                           th:field="*{stock}"
                           min="0"
                           placeholder="0"
                           required
                           class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none focus:border-violet-500 focus:ring-4 focus:ring-violet-100" />
                    <small th:if="${#fields.hasErrors('stock')}"
                           th:errors="*{stock}"
                           class="block rounded-lg border border-rose-200 bg-rose-50 px-3 py-2 text-sm text-rose-700"></small>
                </div>

                <div class="space-y-2">
                    <label for="imagenArchivo" class="block text-sm font-semibold text-slate-700">Imagen</label>
                    <input type="file"
                           id="imagenArchivo"
                           name="imagenArchivo"
                           accept="image/*"
                           class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none focus:border-violet-500 focus:ring-4 focus:ring-violet-100" />

                    <div th:if="${producto.id != null and producto.imagen != null}"
                         class="mt-3 overflow-hidden rounded-xl border border-slate-200 bg-slate-100">
                        <img th:src="@{/productos/{id}/imagen(id=${producto.id})}"
                             alt="Imagen actual del producto"
                             class="h-40 w-full object-cover">
                    </div>
                </div>

                <div class="md:col-span-2 space-y-2">
                    <label for="descripcion" class="block text-sm font-semibold text-slate-700">Descripción</label>
                    <textarea id="descripcion"
                              th:field="*{descripcion}"
                              rows="4"
                              placeholder="Descripción del producto"
                              class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none focus:border-violet-500 focus:ring-4 focus:ring-violet-100"></textarea>
                    <small th:if="${#fields.hasErrors('descripcion')}"
                           th:errors="*{descripcion}"
                           class="block rounded-lg border border-rose-200 bg-rose-50 px-3 py-2 text-sm text-rose-700"></small>
                </div>

                <div class="space-y-2">
                    <label for="categoriaId" class="block text-sm font-semibold text-slate-700">Categoría</label>
                    <select id="categoriaId"
                            name="categoriaId"
                            class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none focus:border-violet-500 focus:ring-4 focus:ring-violet-100">
                        <option value="">Selecciona una categoría</option>
                        <option th:each="categoriaItem : ${categorias}"
                                th:value="${categoriaItem.id}"
                                th:text="${categoriaItem.nombre}"
                                th:selected="${producto.categoria != null and producto.categoria.id == categoriaItem.id}">
                        </option>
                    </select>
                </div>

                <div class="flex items-center gap-3 pt-7">
                    <input type="checkbox"
                           id="activo"
                           th:field="*{activo}"
                           class="h-5 w-5 rounded border-slate-300 text-violet-600 focus:ring-violet-500" />
                    <label for="activo" class="text-sm font-semibold text-slate-700">Producto activo</label>
                </div>
            </div>

            <div class="flex flex-col gap-3 border-t border-slate-200 pt-5 sm:flex-row sm:justify-end">
                <a class="inline-flex items-center justify-center rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm font-semibold text-slate-700 transition hover:bg-slate-100"
                   th:href="@{/admin/productos}">Cancelar</a>
                <button type="submit"
                        class="inline-flex items-center justify-center rounded-2xl bg-violet-600 px-4 py-3 text-sm font-semibold text-white transition hover:bg-violet-700"
                        th:text="${producto.id == null ? 'Crear producto' : 'Guardar cambios'}">Guardar</button>
            </div>
        </form>
    </section>
</main>

</body>
</html>
