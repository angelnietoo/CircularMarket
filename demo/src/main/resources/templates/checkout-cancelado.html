<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago cancelado | CircularMarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script th:src="@{/js/fragments/header.js}" defer></script>
</head>

<body class="bg-slate-50 text-slate-950">

<div th:replace="~{fragments/header :: header}"></div>

<main class="min-h-screen font-sans"
      style="background: radial-gradient(900px 500px at 10% -10%, rgba(21, 81, 193, .06), transparent 60%), radial-gradient(900px 500px at 110% 110%, rgba(21, 81, 193, .06), transparent 60%), #f8fafc;">

    <section class="mx-auto flex min-h-[calc(100vh-160px)] max-w-3xl items-center justify-center px-4 py-16">
        <div class="w-full rounded-[26px] border border-slate-200 bg-white p-8 text-center shadow-lg sm:p-10">
            <div class="mx-auto mb-6 flex h-20 w-20 items-center justify-center rounded-full bg-amber-100 text-4xl font-black text-amber-700">
                !
            </div>

            <h1 class="text-3xl font-extrabold tracking-tight text-slate-950 sm:text-4xl">
                Pago cancelado
            </h1>

            <p class="mx-auto mt-4 max-w-xl text-sm leading-6 text-slate-500">
                No se ha realizado ningún cargo. Puedes volver al carrito y continuar con el pedido cuando quieras.
            </p>

            <div class="mt-8 flex flex-col gap-3 sm:flex-row sm:justify-center">
                <a th:href="@{/carrito}"
                   class="inline-flex justify-center rounded-xl bg-blue-700 px-5 py-3 text-sm font-semibold text-white hover:bg-blue-800">
                    Volver al carrito
                </a>

                <a th:href="@{/productos}"
                   class="inline-flex justify-center rounded-xl bg-slate-100 px-5 py-3 text-sm font-semibold text-slate-700 hover:bg-slate-200">
                    Seguir comprando
                </a>
            </div>
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
