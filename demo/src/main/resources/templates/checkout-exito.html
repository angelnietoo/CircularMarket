<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago completado | CircularMarket</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script th:src="@{/js/fragments/header.js}" defer></script>

    <style>
        .pantalla-exito {
            animation: desvanecerPago 1s ease-in-out forwards;
            animation-delay: 0.35s;
        }

        @keyframes desvanecerPago {
            from {
                opacity: 1;
                transform: translateY(0);
            }

            to {
                opacity: 0;
                transform: translateY(-10px);
            }
        }
    </style>

    <script>
        window.addEventListener("DOMContentLoaded", function () {
            setTimeout(function () {
                window.location.href = "/inicio";
            }, 1000);
        });
    </script>
</head>

<body class="bg-slate-50 text-slate-950">

<div th:replace="~{fragments/header :: header}"></div>

<main class="min-h-screen font-sans"
      style="background: radial-gradient(900px 500px at 10% -10%, rgba(21, 81, 193, .06), transparent 60%), radial-gradient(900px 500px at 110% 110%, rgba(21, 81, 193, .06), transparent 60%), #f8fafc;">

    <section class="mx-auto flex min-h-[calc(100vh-160px)] max-w-3xl items-center justify-center px-4 py-16 pantalla-exito">
        <div class="w-full rounded-[26px] border border-emerald-200 bg-white p-8 text-center shadow-lg sm:p-10">
            <div class="mx-auto mb-6 flex h-20 w-20 items-center justify-center rounded-full bg-emerald-100 text-4xl font-black text-emerald-700">
                ✓
            </div>

            <h1 class="text-3xl font-extrabold tracking-tight text-slate-950 sm:text-4xl">
                Pago completado correctamente
            </h1>

            <p class="mx-auto mt-4 max-w-xl text-sm leading-6 text-slate-500">
                Gracias por tu compra. Te redirigiremos al inicio automáticamente.
            </p>

            <div th:if="${sessionId != null}"
                 class="mt-6 rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-left">
                <p class="text-xs font-semibold uppercase tracking-wide text-slate-400">
                    Referencia de pago
                </p>

                <p class="mt-1 break-all text-sm font-medium text-slate-700"
                   th:text="${sessionId}">
                    session_id
                </p>
            </div>
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
