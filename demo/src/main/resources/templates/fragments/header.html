<header th:fragment="header"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <div class="sticky top-0 z-[1000] relative flex w-full min-h-[60px] items-center gap-3
                bg-[rgba(239,246,255,0.92)] backdrop-blur-md text-gray-800
                px-3 py-2 border-b border-gray-300
                shadow-[0_2px_10px_rgba(31,41,55,0.04)]
                flex-wrap xl:h-[60px] xl:flex-nowrap xl:px-7 xl:py-0 xl:gap-4">

        <!-- Botón categorías / menú hamburguesa -->
        <button type="button"
                onclick="toggleCategoriasMenu()"
                class="relative z-[1700] order-1 inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-xl border border-gray-300 bg-white text-gray-800 shadow-sm transition hover:border-blue-400 hover:bg-blue-50 hover:text-blue-700"
                aria-label="Abrir menú de categorías"
                aria-controls="headerCategoriasMenu"
                aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true" class="h-6 w-6 fill-current">
                <path d="M4 6h16v2H4V6zm0 5h16v2H4v-2zm0 5h16v2H4v-2z"/>
            </svg>
        </button>

        <!-- Logo -->
        <a th:href="@{/inicio}"
           class="relative z-[1700] order-2 shrink-0 text-lg font-extrabold tracking-tight whitespace-nowrap leading-none no-underline sm:text-xl">
            <span class="text-gray-800">Circular</span><span class="text-blue-600">Market</span>
        </a>

        <!-- Buscador responsive -->
        <form class="relative z-[1600] order-4 w-full min-w-0
                     xl:absolute xl:left-1/2 xl:top-1/2 xl:order-3 xl:w-[480px] xl:-translate-x-1/2 xl:-translate-y-1/2
                     2xl:w-[520px]
                     min-[1800px]:w-[600px]"
              th:action="@{/productos}"
              method="get">

            <div class="relative w-full">
                <div class="flex w-full min-w-0 h-9 border border-gray-300 rounded-lg overflow-hidden bg-white box-border transition-colors duration-200 ease-in-out focus-within:border-blue-400 focus-within:ring-2 focus-within:ring-blue-100/25">
                    <input type="text"
                           id="buscadorHeader"
                           name="q"
                           th:value="${busqueda}"
                           placeholder="Buscar productos..."
                           maxlength="60"
                           pattern="[A-Za-zÁÉÍÓÚáéíóúÑñÜü0-9 .,\-]+"
                           autocomplete="off"
                           class="flex-1 border-0 outline-none bg-transparent text-gray-800 text-sm h-full px-3.5 min-w-0 box-border placeholder-gray-400 focus:shadow-none">

                    <button type="submit"
                            class="w-[46px] min-w-[46px] h-full border-0 bg-blue-600 text-white cursor-pointer inline-flex items-center justify-center transition-colors duration-200 ease-in-out hover:bg-blue-700"
                            aria-label="Buscar productos"
                            title="Buscar productos">
                        <svg viewBox="0 0 24 24" aria-hidden="true" class="w-4 h-4 block fill-current">
                            <path d="M10 4a6 6 0 104.472 10.028l4.75 4.75 1.414-1.414-4.75-4.75A6 6 0 0010 4zm0 2a4 4 0 110 8 4 4 0 010-8z"/>
                        </svg>
                    </button>
                </div>

                <div id="busquedasRecientes"
                     class="absolute left-0 right-0 top-full z-[1700] mt-2 hidden overflow-hidden rounded-xl border border-gray-200 bg-white shadow-xl">
                </div>
            </div>
        </form>

        <!-- Botones derecha -->
        <div class="relative z-[1700] order-3 ml-auto flex min-w-0 shrink-0 items-center gap-2 sm:gap-2.5 xl:order-4 xl:gap-3">

            <a th:href="@{/productos}"
               class="hidden whitespace-nowrap text-gray-800 no-underline font-semibold text-sm leading-none transition-colors duration-200 ease-in-out hover:text-blue-600 md:inline">
                Productos
            </a>

            <a th:href="@{/pedidos}"
               class="hidden whitespace-nowrap text-gray-800 no-underline font-semibold text-sm leading-none transition-colors duration-200 ease-in-out hover:text-blue-600 md:inline">
                Pedidos
            </a>

            <a th:href="@{/carrito}"
               class="relative inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-xl border border-gray-300 bg-white text-gray-800 shadow-sm transition hover:border-blue-400 hover:bg-blue-50 hover:text-blue-700"
               aria-label="Ir al carrito"
               title="Carrito">

                <svg viewBox="0 0 24 24"
                     aria-hidden="true"
                     class="h-5 w-5 fill-current">
                    <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zm10 0c-1.1 0-1.99.9-1.99 2S15.9 22 17 22s2-.9 2-2-.9-2-2-2zM7.2 14.8h7.45c.75 0 1.41-.41 1.75-1.03L20 7.24A1 1 0 0019.12 5H6.21L5.27 3H2v2h2l3.6 7.59-1.35 2.44C5.52 16.37 6.48 18 8 18h11v-2H8l1.1-2zM7.16 7h10.26l-2.76 5H9.53L7.16 7z"/>
                </svg>

                <span th:if="${carritoCantidad != null and carritoCantidad > 0}"
                      th:text="${carritoCantidad > 99 ? '99+' : carritoCantidad}"
                      class="absolute -right-2 -top-2 flex h-5 min-w-5 items-center justify-center rounded-full bg-rose-600 px-1.5 text-[11px] font-extrabold leading-none text-white shadow-md ring-2 ring-white">
                    1
                </span>
            </a>

            <a th:href="@{/admin}"
               sec:authorize="hasAuthority('ROLE_ADMIN')"
               class="hidden whitespace-nowrap text-gray-800 no-underline font-semibold text-sm leading-none transition-colors duration-200 ease-in-out hover:text-blue-600 min-[1800px]:inline">
                Panel de administrador
            </a>

            <a th:href="@{/admin}"
               sec:authorize="hasAuthority('ROLE_ADMIN')"
               class="hidden whitespace-nowrap text-gray-800 no-underline font-semibold text-sm leading-none transition-colors duration-200 ease-in-out hover:text-blue-600 xl:inline min-[1800px]:hidden">
                Admin
            </a>

            <div class="relative flex-shrink-0 flex items-center" sec:authorize="isAuthenticated()">
                <button type="button"
                        class="border border-gray-300 bg-white text-gray-800 p-1.5 px-2.5 rounded-xl cursor-pointer font-bold text-sm min-h-[38px] inline-flex items-center justify-center transition-all duration-200 ease-in-out hover:border-blue-400/50 hover:bg-gray-50 hover:-translate-y-0.5 hover:shadow-md box-border text-left leading-tight no-underline sm:px-3"
                        onclick="toggleCuentaMenu()"
                        aria-haspopup="true"
                        aria-controls="headerCuentaMenu"
                        aria-expanded="false">

                    <span class="hidden flex-col items-start gap-[3px] whitespace-nowrap lg:flex">
                        <span class="text-xs font-semibold text-gray-500 leading-none">
                            Bienvenido,
                            <span th:text="${@usuarioSesion.obtenerNombre(#authentication)}">Usuario</span>
                        </span>
                        <span class="text-sm font-extrabold text-gray-800 leading-none">Cuenta ▾</span>
                    </span>

                    <span class="text-sm font-extrabold text-gray-800 leading-none lg:hidden">
                        Cuenta ▾
                    </span>
                </button>

                <div id="headerCuentaMenu"
                     class="absolute top-full right-0 min-w-52 bg-white border border-gray-300 rounded-2xl shadow-xl p-2 hidden z-[1800]">

                    <a th:href="@{/configuracion}"
                       class="block p-2.5 px-3 rounded-xl text-gray-800 no-underline font-semibold text-sm transition-colors duration-200 ease-in-out hover:bg-blue-50 hover:text-blue-800">
                        Configuración
                    </a>

                    <a th:href="@{/admin}"
                       sec:authorize="hasAuthority('ROLE_ADMIN')"
                       class="block rounded-xl px-3 py-2.5 text-sm font-semibold text-gray-800 no-underline transition-colors duration-200 ease-in-out hover:bg-blue-50 hover:text-blue-800 xl:hidden">
                        Panel de administrador
                    </a>

                    <form th:action="@{/logout}" method="post" style="margin:0;">
                        <button type="submit"
                                class="w-full border-0 bg-transparent text-gray-800 text-left p-2.5 px-3 rounded-xl font-semibold text-sm cursor-pointer mt-1 transition-colors duration-200 ease-in-out hover:bg-blue-50 hover:text-blue-800">
                            Cerrar sesión
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div id="buscadorOverlay"
         class="fixed inset-0 z-[900] hidden bg-black/35"></div>

    <div id="categoriasOverlay"
         onclick="cerrarCategoriasMenu()"
         class="fixed inset-0 z-[1100] hidden bg-black/35"></div>

    <aside id="headerCategoriasMenu"
           class="fixed left-0 top-0 z-[1200] h-screen w-[240px] max-w-[80vw] -translate-x-full border-r border-slate-200 bg-white shadow-2xl transition-transform duration-300 ease-in-out">

        <div class="flex h-[60px] items-center justify-between border-b border-slate-200 bg-slate-50 px-4">
            <div>
                <p class="text-base font-extrabold text-slate-900">
                    Menú
                </p>
                <p class="text-xs text-slate-500">
                    Navegación y categorías
                </p>
            </div>

            <button type="button"
                    onclick="cerrarCategoriasMenu()"
                    class="inline-flex h-8 w-8 items-center justify-center rounded-lg border border-slate-300 bg-white text-slate-700 transition hover:bg-slate-100"
                    aria-label="Cerrar menú de categorías">
                ✕
            </button>
        </div>

        <nav class="h-[calc(100vh-60px)] overflow-y-auto p-2">

            <!-- Navegación principal en pantallas pequeñas -->
            <div class="mb-3 border-b border-slate-200 pb-3 md:hidden">
                <p class="px-3 pb-2 text-xs font-extrabold uppercase tracking-[0.18em] text-slate-400">
                    Navegación
                </p>

                <a th:href="@{/productos}"
                   class="block rounded-lg px-3 py-2 text-sm font-bold text-slate-700 transition hover:bg-blue-50 hover:text-blue-700">
                    Productos
                </a>

                <a th:href="@{/pedidos}"
                   class="block rounded-lg px-3 py-2 text-sm font-bold text-slate-700 transition hover:bg-blue-50 hover:text-blue-700">
                    Pedidos
                </a>

                <a th:href="@{/carrito}"
                   class="block rounded-lg px-3 py-2 text-sm font-bold text-slate-700 transition hover:bg-blue-50 hover:text-blue-700">
                    Carrito
                </a>
            </div>

            <!-- Categorías -->
            <div>
                <p class="px-3 pb-2 text-xs font-extrabold uppercase tracking-[0.18em] text-slate-400">
                    Categorías
                </p>

                <a th:href="@{/productos}"
                   th:classappend="${categoriaSeleccionadaId == null} ? 'bg-blue-600 text-white hover:bg-blue-600 hover:text-white' : 'text-slate-700 hover:bg-blue-50 hover:text-blue-700'"
                   class="block rounded-lg px-3 py-2 text-sm font-bold transition">
                    Todas las categorías
                </a>

                <a th:each="categoria : ${categoriasHeader}"
                   th:href="@{/productos(categoriaId=${categoria.id})}"
                   th:text="${categoria.nombre}"
                   th:classappend="${categoriaSeleccionadaId != null and categoria.id == categoriaSeleccionadaId} ? 'bg-blue-600 text-white hover:bg-blue-600 hover:text-white' : 'text-slate-700 hover:bg-blue-50 hover:text-blue-700'"
                   class="block rounded-lg px-3 py-2 text-sm font-bold transition">
                    Categoría
                </a>
            </div>

        </nav>

    </aside>

</header>
