<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="sidebar"
       class="w-full border-b border-slate-200 bg-white lg:w-72 lg:border-r lg:border-b-0">
    <div class="p-6 lg:p-8">
        <div class="mb-8">
            <h1 class="text-2xl font-bold tracking-tight text-slate-900">
                Circular<span class="text-blue-600">Market</span>
            </h1>
            <p class="mt-2 text-sm text-slate-500">Panel de administración</p>
        </div>

        <nav class="flex flex-col gap-2">
            <a class="rounded-xl px-4 py-3 text-sm font-semibold text-slate-700 transition hover:bg-slate-100 hover:text-slate-900"
               th:href="@{/admin}">
                Dashboard
            </a>

            <a class="rounded-xl px-4 py-3 text-sm font-semibold text-slate-700 transition hover:bg-slate-100 hover:text-slate-900"
               th:href="@{/admin/usuarios}">
                Usuarios
            </a>

            <a class="rounded-xl px-4 py-3 text-sm font-semibold text-slate-700 transition hover:bg-slate-100 hover:text-slate-900"
               th:href="@{/admin/productos}">
                Productos
            </a>

            <a class="rounded-xl px-4 py-3 text-sm font-semibold text-slate-700 transition hover:bg-slate-100 hover:text-slate-900"
               th:href="@{/admin/categorias}">
                Categorías
            </a>

            <a class="rounded-xl px-4 py-3 text-sm font-semibold text-slate-700 transition hover:bg-slate-100 hover:text-slate-900"
               th:href="@{/inicio}">
                Volver a la web
            </a>

            <a class="rounded-xl px-4 py-3 text-sm font-semibold text-slate-700 transition hover:bg-slate-100 hover:text-slate-900"
               th:href="@{/logout}">
                Cerrar sesión
            </a>
        </nav>
    </div>
</aside>
</body>
</html>
