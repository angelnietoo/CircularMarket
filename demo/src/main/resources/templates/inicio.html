<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>
    <link rel="stylesheet" th:href="@{/css/inicio.css}">
</head>

<body>

<!-- HEADER -->
<div th:replace="fragments/header :: header"></div>

<div class="inicio-page-wrapper">

    <section class="inicio-hero">
        <div class="inicio-hero-content">
            <p class="inicio-hero-kicker">Bienvenido a Circular Market</p>
            <h1 class="inicio-hero-title">Todo lo que necesitas, en un solo lugar</h1>
            <p class="inicio-hero-text">
                Descubre productos destacados, ofertas y novedades con un diseño limpio, moderno y fácil de usar.
            </p>
            <a th:href="@{/ofertas}" class="inicio-hero-button">Ver ofertas</a>
        </div>
    </section>

    <main class="inicio-content">
        <section class="inicio-section-header">
            <h2>Productos destacados</h2>
            <a th:href="@{/productos}" class="inicio-view-all">Ver todos</a>
        </section>

        <section class="inicio-product-grid">
            <article class="inicio-product-card" th:each="producto : ${productos}">
                <div class="inicio-product-image">
                    <img th:src="@{${producto.imagen}}" alt="Imagen del producto">
                </div>

                <div class="inicio-product-info">
                    <h3 th:text="${producto.nombre}">Nombre del producto</h3>

                    <p class="inicio-product-description" th:text="${producto.descripcion}">
                        Descripción del producto
                    </p>

                    <div class="inicio-product-footer">
                        <span class="inicio-product-price" th:text="${producto.precio} + ' €'">
                            99,99 €
                        </span>

                        <a th:href="@{/producto/{id}(id=${producto.id})}" class="inicio-product-button">
                            Ver producto
                        </a>
                    </div>
                </div>
            </article>
        </section>
    </main>

</div>

<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
