<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-combined">

            <div class="login-visual">
                <img th:src="@{/images/LoginImagen.png}" alt="Circular Market empresa" class="login-image">
            </div>

            <div class="card">
                <h1>Iniciar sesión</h1>
                <p class="subtitle">Accede con tu email y contraseña</p>

                <div class="message" th:if="${param.error}">
                    Email o contraseña incorrectos.
                </div>

                <div class="message success" th:if="${param.registrado}">
                    Registro completado correctamente.
                </div>

                <div class="message success" th:if="${param.logout}">
                    Sesión cerrada correctamente.
                </div>

                <form th:action="@{/login}" method="post">
                    <div class="field">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="username" class="input" placeholder="Introduce tu email" required>
                    </div>

                    <div class="field">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" class="input" placeholder="Introduce tu contraseña" required>
                    </div>

                    <div class="forgot-link">
                        <a th:href="@{/forgot-password}">He olvidado mi contraseña</a>
                    </div>

                    <button type="submit" class="btn btn-primary">Entrar</button>
                </form>

                <div class="footer-link">
                    ¿No tienes cuenta?
                    <a th:href="@{/registro}">Regístrate aquí</a>
                </div>
            </div>

        </div>
    </div>
</body>
</html>
