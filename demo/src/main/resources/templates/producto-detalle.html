<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${producto.titulo} + ' | CircularMarket'">Detalle del producto | CircularMarket</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script th:src="@{/js/fragments/header.js}" defer></script>
</head>

<body class="bg-slate-50 text-slate-950 font-sans">

<div th:replace="~{fragments/header :: header}"></div>

<main class="mx-auto max-w-7xl px-6 py-10 lg:px-8">

    <section class="mb-6">
        <a th:href="@{/productos}"
           class="inline-flex items-center rounded-full border border-slate-200 bg-white px-4 py-2 text-sm font-semibold text-slate-700 shadow-sm hover:bg-slate-100">
            Volver a productos
        </a>
    </section>

    <section class="grid gap-8 rounded-[24px] border border-slate-200 bg-white p-6 shadow-lg lg:grid-cols-[minmax(0,1.1fr)_minmax(360px,0.9fr)] lg:p-8">

        <div class="overflow-hidden rounded-[22px] bg-slate-100">
            <img th:if="${producto.imagen != null}"
                 th:src="@{/productos/{id}/imagen(id=${producto.id})}"
                 alt="Imagen del producto"
                 class="h-[420px] w-full object-cover">

            <div th:if="${producto.imagen == null}"
                 class="flex h-[420px] w-full items-center justify-center text-sm font-semibold text-slate-400">
                Sin imagen
            </div>
        </div>

        <div class="flex flex-col">
            <div class="mb-4">
                <p th:if="${producto.categoria != null}"
                   th:text="${producto.categoria.nombre}"
                   class="mb-3 inline-flex rounded-full bg-blue-50 px-3 py-1 text-xs font-bold uppercase tracking-wide text-blue-700">
                    Categoría
                </p>

                <h1 th:text="${producto.titulo}"
                    class="text-3xl font-extrabold leading-tight tracking-tight text-slate-900 lg:text-4xl">
                    Nombre del producto
                </h1>
            </div>

            <div class="mb-6 border-y border-slate-200 py-5">
                <p th:text="${#numbers.formatDecimal(producto.precio, 1, 2)} + ' €'"
                   class="text-4xl font-extrabold text-slate-950">
                    0,00 €
                </p>

                <p th:if="${producto.stock != null and producto.stock > 0}"
                   th:text="'Stock disponible: ' + ${producto.stock}"
                   class="mt-3 text-sm font-semibold text-green-700">
                    Stock disponible
                </p>

                <p th:if="${producto.stock == null or producto.stock <= 0}"
                   class="mt-3 text-sm font-semibold text-red-600">
                    Sin stock disponible
                </p>
            </div>

            <div class="mb-8">
                <h2 class="mb-3 text-lg font-bold text-slate-900">Descripción</h2>

                <p th:if="${producto.descripcion != null and !producto.descripcion.isBlank()}"
                   th:text="${producto.descripcion}"
                   class="text-sm leading-7 text-slate-600">
                    Descripción del producto
                </p>

                <p th:if="${producto.descripcion == null or producto.descripcion.isBlank()}"
                   class="text-sm leading-7 text-slate-500">
                    Este producto no tiene descripción.
                </p>
            </div>

            <div class="mt-auto grid gap-3 sm:grid-cols-2">
                <form th:action="@{/carrito/anadir/{id}(id=${producto.id})}" method="post">
                    <button type="submit"
                            th:disabled="${producto.stock == null or producto.stock <= 0}"
                            class="inline-flex w-full justify-center rounded-2xl border border-slate-200 bg-slate-100 px-5 py-3 text-sm font-bold text-slate-900 hover:bg-slate-200 disabled:cursor-not-allowed disabled:opacity-50">
                        Añadir al carrito
                    </button>
                </form>

                <form th:action="@{/comprar-ya/{id}(id=${producto.id})}" method="post">
                    <button type="submit"
                            th:disabled="${producto.stock == null or producto.stock <= 0}"
                            class="inline-flex w-full justify-center rounded-2xl bg-blue-600 px-5 py-3 text-sm font-bold text-white hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-50">
                        Comprar ya
                    </button>
                </form>
            </div>
        </div>

    </section>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
