<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos | CircularMarket</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script th:src="@{/js/fragments/header.js}" defer></script>
</head>

<body class="bg-slate-50 text-slate-950 font-sans">

<div th:replace="~{fragments/header :: header}"></div>

<main class="w-full px-3 py-6 sm:px-4 lg:px-5">

    <header class="mb-6 border border-slate-200 bg-white/90 p-5 shadow-sm">
        <h1 class="text-3xl font-bold text-slate-900">
            Todos los productos
        </h1>

        <p class="mt-2 text-sm text-slate-500">
            Explora todos los productos disponibles en CircularMarket.
        </p>
    </header>

    <section th:if="${productos == null or #lists.isEmpty(productos)}"
             class="border border-slate-200 bg-white p-8 text-center shadow-sm">
        <h2 class="text-xl font-bold text-slate-900">
            No hay productos disponibles
        </h2>

        <p class="mt-2 text-sm text-slate-500">
            Todavía no se han añadido productos a esta categoría.
        </p>
    </section>

    <section th:if="${productos != null and !#lists.isEmpty(productos)}"
             class="grid gap-4 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6">

        <article th:each="producto : ${productos}"
                 th:onclick="|window.location.href='@{/productos/{id}(id=${producto.id})}'|"
                 class="group cursor-pointer overflow-hidden border border-slate-200 bg-white shadow-sm transition hover:border-slate-300 hover:shadow-md">

            <div class="h-52 bg-slate-100">
                <img th:if="${producto.imagen != null}"
                     th:src="@{/productos/{id}/imagen(id=${producto.id})}"
                     alt="Imagen del producto"
                     class="h-full w-full object-cover">

                <div th:if="${producto.imagen == null}"
                     class="flex h-full w-full items-center justify-center text-sm font-semibold text-slate-400">
                    Sin imagen
                </div>
            </div>

            <div class="space-y-2.5 p-4">
                <div>
                    <h2 th:text="${producto.titulo}"
                        class="line-clamp-2 text-base font-bold text-slate-900 group-hover:text-yellow-500">
                        Nombre del producto
                    </h2>

                    <p th:if="${producto.categoria != null}"
                       th:text="${producto.categoria.nombre}"
                       class="mt-1 text-xs font-semibold uppercase tracking-wide text-blue-600">
                        Categoría
                    </p>
                </div>

                <p th:text="${producto.descripcion}"
                   class="line-clamp-3 text-sm leading-5 text-slate-500">
                    Descripción del producto
                </p>

                <div class="flex items-center justify-between gap-3 pt-2">
                    <span th:text="${#numbers.formatDecimal(producto.precio, 1, 2)} + ' €'"
                          class="text-lg font-extrabold text-slate-900">
                        0.00 €
                    </span>

                    <span th:if="${producto.stock != null}"
                          th:text="'Stock: ' + ${producto.stock}"
                          class="rounded-full bg-slate-100 px-2.5 py-1 text-xs font-semibold text-slate-600">
                        Stock
                    </span>
                </div>
            </div>
        </article>

    </section>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
