<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Recuperar contraseña | CircularMarket</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-[radial-gradient(900px_500px_at_10%_-10%,rgba(21,81,193,0.06),transparent_60%),radial-gradient(900px_500px_at_110%_110%,rgba(21,81,193,0.06),transparent_60%),#f8fafc] font-sans text-slate-950">

<div class="flex min-h-screen items-center justify-center px-4 py-8">

    <div class="w-full max-w-md rounded-[22px] border border-slate-200 bg-white px-7 py-8 shadow-2xl sm:px-9">

        <div class="mb-6">
            <h1 class="mb-1 text-3xl font-bold">Recuperar contraseña</h1>
            <p class="text-sm leading-6 text-slate-500">
                Introduce el correo de tu cuenta y te enviaremos un enlace para crear una nueva contraseña.
            </p>
        </div>

        <div th:if="${mensaje}"
             class="mb-4 rounded-2xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm font-semibold text-emerald-700">
            <span th:text="${mensaje}"></span>
        </div>

        <div th:if="${error}"
             class="mb-4 rounded-2xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm font-semibold text-rose-700">
            <span th:text="${error}"></span>
        </div>

        <form th:action="@{/recuperar-contrasena}" method="post" class="space-y-5">

            <div class="space-y-2">
                <label for="email" class="block text-sm font-semibold text-slate-700">
                    Email
                </label>

                <input type="email"
                       id="email"
                       name="email"
                       placeholder="Introduce tu email"
                       required
                       class="w-full rounded-[14px] border border-slate-200 bg-slate-50 px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
            </div>

            <button type="submit"
                    class="w-full rounded-[14px] bg-gradient-to-b from-blue-600 to-blue-700 px-5 py-3 text-sm font-bold text-white shadow-lg transition hover:from-blue-700 hover:to-blue-800">
                Enviar enlace
            </button>
        </form>

        <div class="mt-6 text-center text-sm text-slate-600">
            <a th:href="@{/login}" class="font-semibold text-blue-700 hover:underline">
                Volver al login
            </a>
        </div>

    </div>

</div>

</body>
</html>
