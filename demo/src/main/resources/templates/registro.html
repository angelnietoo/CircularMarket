<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" th:href="@{/css/Registro.css}">
</head>
<body>
    <div class="auth-wrapper">
        <div class="card card-register">
            <h1>Crear cuenta</h1>
            <p class="subtitle">Rellena los datos para registrarte</p>

            <div class="message" th:if="${error}" th:text="${error}"></div>

            <form th:action="@{/registro}" method="post" th:object="${registroRequest}">
                <div class="field">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" th:field="*{nombre}" class="input" placeholder="Introduce tu nombre" required>
                </div>

                <div class="field">
                    <label for="apellidos">Apellidos</label>
                    <input type="text" id="apellidos" th:field="*{apellidos}" class="input" placeholder="Introduce tus apellidos" required>
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" th:field="*{email}" class="input" placeholder="Introduce tu email" required>
                </div>

                <div class="field">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" th:field="*{password}" class="input" placeholder="Introduce tu contraseña" required>
                </div>

                <div class="field">
                    <label for="repetirPassword">Repetir contraseña</label>
                    <input type="password" id="repetirPassword" th:field="*{repetirPassword}" class="input" placeholder="Repite tu contraseña" required>
                </div>

                <button type="submit" class="btn btn-primary">Registrarse</button>
            </form>

            <div class="footer-link">
                ¿Ya tienes cuenta?
                <a th:href="@{/login}">Inicia sesión aquí</a>
            </div>
        </div>
    </div>
</body>
</html>
