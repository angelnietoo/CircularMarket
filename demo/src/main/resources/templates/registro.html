<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[radial-gradient(900px_500px_at_10%_-10%,rgba(21,81,193,0.06),transparent_60%),radial-gradient(900px_500px_at_110%_110%,rgba(21,81,193,0.06),transparent_60%),#f8fafc] font-sans text-slate-950">
    <div class="flex min-h-screen items-center justify-center px-4 py-10">
        <div class="relative w-full max-w-3xl overflow-hidden rounded-[14px] border border-slate-200 bg-white p-8 shadow-2xl sm:p-10">
            <div class="absolute inset-x-0 top-0 h-1 rounded-b-full bg-gradient-to-r from-blue-600 to-sky-400"></div>
            <div class="pt-6"></div>

            <h1 class="mb-2 text-3xl font-bold">Crear cuenta</h1>
            <p class="mb-6 text-sm leading-7 text-slate-500">Rellena los datos para registrarte</p>

            <div class="mb-4 rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm font-semibold text-rose-700" th:if="${error}" th:text="${error}"></div>

            <form th:action="@{/registro}" method="post" th:object="${registroRequest}" class="space-y-4">

                <div class="space-y-2">
                    <label for="nombre" class="block text-sm font-semibold text-slate-700">Nombre</label>
                    <input type="text" id="nombre" th:field="*{nombre}" placeholder="Introduce tu nombre" required class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
                </div>

                <div class="space-y-2">
                    <label for="apellidos" class="block text-sm font-semibold text-slate-700">Apellidos</label>
                    <input type="text" id="apellidos" th:field="*{apellidos}" placeholder="Introduce tus apellidos" required class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
                </div>

                <div class="space-y-2">
                    <label for="email" class="block text-sm font-semibold text-slate-700">Email</label>
                    <input type="email" id="email" th:field="*{email}" placeholder="Introduce tu email" required class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
                </div>

                <div class="space-y-2">
                    <label for="telefono" class="block text-sm font-semibold text-slate-700">Teléfono</label>
                    <input type="tel" id="telefono" th:field="*{telefono}" placeholder="Introduce tu teléfono" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
                </div>

                <div class="space-y-2">
                    <label for="direccion" class="block text-sm font-semibold text-slate-700">Dirección</label>
                    <input type="text" id="direccion" th:field="*{direccion}" placeholder="Introduce tu dirección" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
                </div>

                <div class="space-y-2">
                    <label for="password" class="block text-sm font-semibold text-slate-700">Contraseña</label>
                    <input type="password" id="password" th:field="*{password}" placeholder="Introduce tu contraseña" required class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
                </div>

                <div class="space-y-2">
                    <label for="repetirPassword" class="block text-sm font-semibold text-slate-700">Repetir contraseña</label>
                    <input type="password" id="repetirPassword" th:field="*{repetirPassword}" placeholder="Repite tu contraseña" required class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
                </div>

                <button type="submit" class="w-full rounded-xl bg-blue-600 px-5 py-3 text-sm font-bold text-white shadow-lg transition hover:bg-blue-700">Registrarse</button>
            </form>

            <div class="mt-4 text-center text-sm text-slate-600">
                ¿Ya tienes cuenta? <a th:href="@{/login}" class="font-semibold text-blue-700 hover:underline">Inicia sesión aquí</a>
            </div>
        </div>
    </div>
</body>
</html>
