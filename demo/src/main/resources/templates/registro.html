<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - CircularMarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[radial-gradient(900px_500px_at_10%_-10%,rgba(21,81,193,0.06),transparent_60%),radial-gradient(900px_500px_at_110%_110%,rgba(21,81,193,0.06),transparent_60%),#f8fafc] font-sans text-slate-950">

<div class="flex min-h-screen items-center justify-center px-4 py-6">
    <div class="relative w-full max-w-3xl overflow-hidden rounded-[16px] border border-slate-200 bg-white p-7 shadow-2xl sm:p-8">
        <div class="absolute inset-x-0 top-0 h-1 rounded-b-full bg-gradient-to-r from-blue-600 to-sky-400"></div>

        <div class="mb-5 pt-3">
            <h1 class="text-2xl font-bold">Crear cuenta</h1>
            <p class="mt-2 text-sm text-slate-500">Rellena los datos para registrarte en CircularMarket</p>
        </div>

        <div class="mb-4 rounded-xl border border-rose-200 bg-rose-50 px-4 py-2.5 text-sm font-semibold text-rose-700"
             th:if="${error}"
             th:text="${error}">
        </div>

        <!-- Metodo post que envía los datos del formulario -->
        <form th:action="@{/registro}" method="post" th:object="${registroRequest}" class="space-y-4">

            <div class="grid grid-cols-1 gap-4 md:grid-cols-2">

                <div class="space-y-1.5">
                    <label for="nombre" class="block text-sm font-semibold text-slate-700">Nombre</label>
                    <input type="text"
                           id="nombre"
                           th:field="*{nombre}"
                           placeholder="Introduce tu nombre"
                           required
                           class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100">
                </div>

                <div class="space-y-1.5">
                    <label for="apellidos" class="block text-sm font-semibold text-slate-700">Apellidos</label>
                    <input type="text"
                           id="apellidos"
                           th:field="*{apellidos}"
                           placeholder="Introduce tus apellidos"
                           required
                           class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100">
                </div>

                <div class="space-y-1.5">
                    <label for="email" class="block text-sm font-semibold text-slate-700">Email</label>
                    <input type="email"
                           id="email"
                           th:field="*{email}"
                           placeholder="Introduce tu email"
                           required
                           class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100">
                </div>

                <div class="space-y-1.5">
                    <label for="telefono" class="block text-sm font-semibold text-slate-700">Teléfono</label>
                    <input type="tel"
                           id="telefono"
                           th:field="*{telefono}"
                           placeholder="Introduce tu teléfono"
                           class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100">
                </div>

                <div class="space-y-1.5 md:col-span-2">
                    <label for="direccion" class="block text-sm font-semibold text-slate-700">Dirección</label>
                    <input type="text"
                           id="direccion"
                           th:field="*{direccion}"
                           placeholder="Introduce tu dirección"
                           class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100">
                </div>

                <div class="space-y-1.5">
                    <label for="password" class="block text-sm font-semibold text-slate-700">Contraseña</label>
                    <input type="password"
                           id="password"
                           th:field="*{password}"
                           placeholder="Introduce tu contraseña"
                           required
                           class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100">
                </div>

                <div class="space-y-1.5">
                    <label for="repetirPassword" class="block text-sm font-semibold text-slate-700">Repetir contraseña</label>
                    <input type="password"
                           id="repetirPassword"
                           th:field="*{repetirPassword}"
                           placeholder="Repite tu contraseña"
                           required
                           class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100">
                </div>

            </div>

            <label for="aceptaTerminos" class="flex items-start gap-3 text-sm text-slate-700">
                <input type="checkbox"
                       id="aceptaTerminos"
                       th:field="*{aceptaTerminos}"
                       required
                       class="mt-1 h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500">

                <span>
                    He leído y acepto los
                    <a th:href="@{/terminos}"
                       target="_blank"
                       rel="noopener noreferrer"
                       class="font-semibold text-blue-700 hover:underline">
                        términos y condiciones de uso
                    </a>
                    y la
                    <a th:href="@{/privacidad}"
                       target="_blank"
                       rel="noopener noreferrer"
                       class="font-semibold text-blue-700 hover:underline">
                        política de privacidad
                    </a>
                    de CircularMarket.
                </span>
            </label>

            <button type="submit"
                    class="w-full rounded-xl bg-blue-600 px-5 py-3 text-sm font-bold text-white shadow-md transition hover:bg-blue-700">
                Registrarse
            </button>
        </form>

        <div class="my-5 flex items-center gap-4">
            <div class="h-px flex-1 bg-slate-200"></div>
            <span class="text-xs font-semibold uppercase tracking-wide text-slate-400">o</span>
            <div class="h-px flex-1 bg-slate-200"></div>
        </div>

        <a th:href="@{/oauth2/authorization/google}"
           class="flex w-full items-center justify-center gap-3 rounded-xl border border-slate-200 bg-white px-5 py-3 text-sm font-bold text-slate-700 shadow-sm transition hover:border-slate-300 hover:bg-slate-50">
            <svg class="h-5 w-5" viewBox="0 0 48 48" aria-hidden="true">
                <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303C33.655 32.657 29.223 36 24 36c-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
                <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
                <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
                <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
            </svg>
            Registrarse con Google
        </a>

        <div class="mt-4 text-center text-sm text-slate-600">
            ¿Ya tienes cuenta?
            <a th:href="@{/login}" class="font-semibold text-blue-700 hover:underline">Inicia sesión aquí</a>
        </div>
    </div>
</div>

</body>
</html>
