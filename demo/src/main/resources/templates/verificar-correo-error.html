<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Verificación de correo | CircularMarket</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-100 text-slate-900 flex items-center justify-center px-4">

<div class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-8 text-center shadow-xl">

    <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-rose-100 text-rose-600">
        <span class="text-2xl font-bold">!</span>
    </div>

    <h1 class="mt-5 text-2xl font-bold text-slate-900">
        No se pudo verificar el correo
    </h1>

    <p class="mt-4 text-sm leading-6 text-slate-600" th:text="${error}">
        El enlace no es válido o ha caducado.
    </p>

    <a th:href="@{/login}"
       class="mt-6 inline-flex w-full items-center justify-center rounded-xl bg-blue-600 px-5 py-3 text-sm font-bold text-white transition hover:bg-blue-700">
        Volver al login
    </a>

</div>

</body>
</html>
